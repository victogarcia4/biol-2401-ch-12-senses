<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapter 12: Nervous System III — General &amp; Special Senses | Anatomy &amp; Physiology</title>
  <meta name="description" content="Interactive Chapter 12 Anatomy & Physiology presentation covering General and Special Senses with Student Learning Objectives and Bloom's Taxonomy Analysis Knowledge Checks." />

  <!-- Google Fonts aligned with Lone Star College Style Guide:
       Cinzel (Trajan Regular uppercase display), Jost (Futura Book/Bold geometric sans), EB Garamond (Garamond secondary serif) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css" />

  <!-- GSAP 3 Animation Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="js/slides-data.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <!-- Top Brand Header (Lone Star College Style Guide) -->
    <header class="top-bar" role="banner">
      <div class="brand-cluster">
        <div class="lsc-crest" aria-hidden="true">
          <svg viewBox="0 0 36 36" width="32" height="32" fill="none">
            <rect width="36" height="36" rx="6" fill="#003768" />
            <path d="M18 6L21.09 12.26L28 13.27L23 18.14L24.18 25.02L18 21.77L11.82 25.02L13 18.14L8 13.27L14.91 12.26L18 6Z" fill="#f1c585" />
            <rect x="4" y="30" width="28" height="3" rx="1.5" fill="#b30838" />
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-super">HUMAN ANATOMY &amp; PHYSIOLOGY &bull; CHAPTER 12</span>
          <h1 class="brand-title">NERVOUS SYSTEM III: SENSES</h1>
        </div>
      </div>

      <!-- Interactive SLO Jump Rail -->
      <nav class="slo-rail" id="sloRail" aria-label="Student Learning Objectives Navigation"></nav>

      <!-- Utility Controls -->
      <div class="top-controls">
        <div class="score-pill" id="scorePill" title="Bloom's Analysis Knowledge Checks Mastered">
          <span class="score-dot"></span>
          <span id="scoreText">0 / 8 SLOs</span>
        </div>
        <button class="icon-btn" id="btnOverview" type="button" title="Slide Overview (O)" aria-label="Open Slide Overview">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" />
          </svg>
          <span class="btn-label">Overview</span>
        </button>
        <button class="icon-btn" id="btnFullscreen" type="button" title="Toggle Fullscreen (F)" aria-label="Toggle Fullscreen">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 3 21 3 21 9" />
            <polyline points="9 21 3 21 3 15" />
            <line x1="21" y1="3" x2="14" y2="10" />
            <line x1="3" y1="21" x2="10" y2="14" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Slide Stage -->
    <main class="stage-wrapper" role="main">
      <article class="slide-stage" id="slideStage" aria-live="polite"></article>
    </main>

    <!-- Bottom Controls & Progress Bar -->
    <footer class="bottom-bar" role="contentinfo">
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="bottom-inner">
        <div class="nav-group">
          <button class="nav-btn" id="btnPrev" type="button" aria-label="Previous Slide">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2">
              <polyline points="15 18 9 12 15 6" />
            </svg>
            <span>Previous</span>
          </button>
          <button class="nav-btn nav-btn-primary" id="btnNext" type="button" aria-label="Next Slide">
            <span>Next</span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2">
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </button>
        </div>

        <div class="slide-meta">
          <span class="slide-counter" id="slideCounter">Slide 1 / 28</span>
          <span class="slide-section-label" id="slideSectionLabel">Introduction</span>
        </div>

        <div class="keyboard-hints" aria-hidden="true">
          <span><kbd>&larr;</kbd> <kbd>&rarr;</kbd> Navigate</span>
          <span><kbd>1</kbd>-<kbd>4</kbd> Answer MCQ</span>
          <span><kbd>O</kbd> Overview</span>
          <span><kbd>F</kbd> Fullscreen</span>
        </div>
      </div>
    </footer>
  </div>

  <!-- Slide Overview Drawer / Modal -->
  <div class="modal-backdrop" id="overviewModal" hidden role="dialog" aria-modal="true" aria-labelledby="overviewTitle">
    <div class="modal-panel overview-panel">
      <div class="modal-header">
        <div>
          <span class="modal-kicker">CHAPTER 12 NAVIGATION</span>
          <h2 id="overviewTitle">SLIDE &amp; SLO OVERVIEW</h2>
        </div>
        <button class="close-btn" id="closeOverview" type="button" aria-label="Close Overview">&times;</button>
      </div>
      <div class="overview-grid" id="overviewGrid"></div>
    </div>
  </div>

  <!-- Image Zoom Lightbox Modal -->
  <div class="modal-backdrop" id="lightboxModal" hidden role="dialog" aria-modal="true" aria-labelledby="lightboxCaption">
    <div class="modal-panel lightbox-panel">
      <button class="close-btn lightbox-close" id="closeLightbox" type="button" aria-label="Close Image">&times;</button>
      <img id="lightboxImg" src="" alt="" />
      <div class="lightbox-footer">
        <p id="lightboxCaption"></p>
        <span class="img-source-badge" id="lightboxSource"></span>
      </div>
    </div>
  </div>
</body>
</html>
